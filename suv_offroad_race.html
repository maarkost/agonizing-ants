<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUV Off-Road Smash!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

  :root {
    --mud: #8B5E3C;
    --dirt: #C4894F;
    --grass: #5A8A3C;
    --sky1: #87CEEB;
    --sky2: #B0E0FF;
    --accent: #FF6B35;
    --yellow: #FFD93D;
    --green: #6BCB77;
    --red: #FF4D4D;
    --white: #FFF9F0;
    --dark: #2D1B00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #screen-select, #screen-game, #screen-finish {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── CAR SELECT SCREEN ── */
  #screen-select {
    background: linear-gradient(160deg, #1a3a1a 0%, #2d5a1b 50%, #1a3a1a 100%);
    display: flex;
  }

  #screen-select h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 5vw, 4rem);
    color: var(--yellow);
    text-shadow: 4px 4px 0 #8B4500, 6px 6px 0 #5A2D00;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-align: center;
  }

  #screen-select .subtitle {
    font-size: 1.1rem;
    color: #aee87a;
    margin-bottom: 32px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .car-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 700px;
    width: 90%;
    margin-bottom: 24px;
  }

  .car-card {
    background: rgba(255,255,255,0.07);
    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 18px 14px 14px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    text-align: center;
    position: relative;
  }

  .car-card:hover, .car-card.selected {
    transform: translateY(-4px) scale(1.03);
    border-color: var(--yellow);
    background: rgba(255,217,61,0.15);
  }

  .car-card canvas {
    display: block;
    margin: 0 auto 10px;
  }

  .car-card .car-name {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: var(--white);
    margin-bottom: 4px;
  }

  .car-card .car-tag {
    font-size: 0.75rem;
    color: #aee87a;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .car-card .badge-selected {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--yellow);
    color: var(--dark);
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 20px;
    display: none;
  }

  .car-card.selected .badge-selected { display: block; }

  #btn-start {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    padding: 14px 48px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #8B2A00;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }

  #btn-start:hover { transform: translateY(2px); box-shadow: 0 4px 0 #8B2A00; }
  #btn-start:active { transform: translateY(5px); box-shadow: 0 1px 0 #8B2A00; }

  /* ── GAME SCREEN ── */
  #screen-game { background: #000; padding: 0; }

  #gameCanvas {
    display: block;
    touch-action: none;
  }

  #hud {
    position: fixed;
    top: 12px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 16px;
    pointer-events: none;
    z-index: 10;
  }

  #hud .hud-box {
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 6px 14px;
    font-family: 'Fredoka One', cursive;
    color: white;
    font-size: 1.1rem;
  }

  #hud .hud-box span { color: var(--yellow); }

  #controls-hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    color: rgba(255,255,255,0.7);
    font-size: 0.8rem;
    border-radius: 20px;
    padding: 5px 16px;
    pointer-events: none;
    z-index: 10;
  }

  /* ── FINISH SCREEN ── */
  #screen-finish {
    background: linear-gradient(160deg, #1a1a3a 0%, #2d1b5a 50%, #1a1a3a 100%);
    flex-direction: column;
    gap: 16px;
  }

  #finish-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.5rem, 7vw, 5rem);
    text-align: center;
  }

  #finish-subtitle {
    font-size: 1.2rem;
    color: rgba(255,255,255,0.7);
    font-weight: 700;
  }

  #finish-stats {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px 40px;
    text-align: center;
    color: white;
    font-size: 1.1rem;
    line-height: 2;
  }

  #finish-stats strong { color: var(--yellow); font-size: 1.3rem; }

  .finish-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .finish-btns button {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .finish-btns button:hover { transform: scale(1.05); }
  #btn-retry { background: var(--accent); color: white; box-shadow: 0 5px 0 #8B2A00; }
  #btn-menu { background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.3); }

  /* touch controls */
  #touch-controls {
    position: fixed;
    bottom: 44px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
    z-index: 20;
  }

  .touch-btn {
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.2);
    border: 3px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    pointer-events: all;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .touch-left { display: flex; gap: 12px; }
  .touch-right { display: flex; gap: 12px; }
</style>
</head>
<body>

<!-- CAR SELECT SCREEN -->
<div id="screen-select">
  <h1>🚙 SUV OFF-ROAD SMASH!</h1>
  <p class="subtitle">⛰️ Choose your SUV and conquer the dirt!</p>
  <div class="car-grid" id="carGrid"></div>
  <button id="btn-start">LET'S RACE! 🏁</button>
</div>

<!-- GAME SCREEN -->
<div id="screen-game">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-box">🏎️ <span id="hud-car">Defender</span></div>
    <div class="hud-box">🏁 Lap <span id="hud-lap">1</span>/3</div>
    <div class="hud-box">💔 HP: <span id="hud-hp">100</span>%</div>
    <div class="hud-box">⏱️ <span id="hud-time">0:00</span></div>
  </div>
  <div id="controls-hint">← → Arrow Keys or A/D to steer &nbsp;|&nbsp; ↑ / W = Gas &nbsp;|&nbsp; ↓ / S = Brake</div>
</div>

<!-- TOUCH CONTROLS -->
<div id="touch-controls">
  <div class="touch-left">
    <div class="touch-btn" id="tb-left">⬅️</div>
    <div class="touch-btn" id="tb-right">➡️</div>
  </div>
  <div class="touch-right">
    <div class="touch-btn" id="tb-gas">⛽</div>
    <div class="touch-btn" id="tb-brake">🛑</div>
  </div>
</div>

<!-- FINISH SCREEN -->
<div id="screen-finish">
  <div id="finish-title">🏆</div>
  <div id="finish-subtitle"></div>
  <div id="finish-stats"></div>
  <div class="finish-btns">
    <button id="btn-retry">🔄 Race Again!</button>
    <button id="btn-menu">🚗 Change Car</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CAR DEFINITIONS
// ─────────────────────────────────────────────
const CARS = [
  { id: 0, name: 'Defender', tag: 'Land Rover • Tough & Classic', color: '#4A7C59', color2: '#2D5A3D', roof: '#3a6047', speed: 7, handling: 0.045, tags: ['🛡️ Very Tough', '⚡ Medium Speed'] },
  { id: 1, name: 'Mercedes GLE', tag: 'Mercedes • Luxury Beast', color: '#B0BEC5', color2: '#78909C', roof: '#90A4AE', speed: 8, handling: 0.04, tags: ['⭐ Luxury', '🚀 Fast'] },
  { id: 2, name: 'Volvo XC90', tag: 'Volvo • Safe & Smooth', color: '#3D6B9E', color2: '#2A4E78', roof: '#2E5F8A', speed: 7.5, handling: 0.05, tags: ['🛡️ Safe', '🔧 Reliable'] },
  { id: 3, name: 'BMW X5', tag: 'BMW • Performance King', color: '#212121', color2: '#111111', roof: '#333', speed: 8.5, handling: 0.042, tags: ['🔥 Super Fast', '🎯 Precise'] },
];

// ─────────────────────────────────────────────
// DRAW PREVIEW SUV on small canvas
// ─────────────────────────────────────────────
function drawPreviewSUV(canvas, car) {
  const ctx = canvas.getContext('2d');
  canvas.width = 120; canvas.height = 70;
  drawSUV(ctx, 60, 38, car, 0, 0, 0.85, false);
}

function drawSUV(ctx, x, y, car, angle, damage, scale=1, shadow=true) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  const hp = Math.max(0, 1 - damage / 100);

  if (shadow) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 6;
  }

  // Body
  ctx.fillStyle = car.color;
  ctx.beginPath();
  ctx.roundRect(-28, -16, 56, 32, 6);
  ctx.fill();

  // Roof
  ctx.fillStyle = car.roof;
  ctx.beginPath();
  ctx.roundRect(-18, -28, 38, 16, 5);
  ctx.fill();

  if (shadow) ctx.restore();

  // Windows
  ctx.fillStyle = 'rgba(180,230,255,0.85)';
  ctx.beginPath();
  ctx.roundRect(-14, -26, 14, 12, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(2, -26, 14, 12, 3);
  ctx.fill();

  // Grill / front lights
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(26, -10, 4, 5);
  ctx.fillRect(26, 3, 4, 5);
  ctx.fillStyle = '#FF4444';
  ctx.fillRect(-30, -10, 4, 5);
  ctx.fillRect(-30, 3, 4, 5);

  // Bumpers
  ctx.fillStyle = car.color2;
  ctx.fillRect(24, -14, 6, 28);
  ctx.fillRect(-30, -14, 6, 28);

  // Wheels (with damage wobble)
  const wobble = damage > 30 ? (Math.random() - 0.5) * (damage / 50) * 4 : 0;
  drawWheel(ctx, -18, 16 + wobble, damage);
  drawWheel(ctx, 18, 16 - wobble, damage);
  drawWheel(ctx, -18, -16 - wobble, damage);
  drawWheel(ctx, 18, -16 + wobble, damage);

  // Damage cracks
  if (damage > 20) {
    ctx.strokeStyle = `rgba(0,0,0,${Math.min(0.8, damage / 80)})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < Math.floor(damage / 20); i++) {
      ctx.beginPath();
      ctx.moveTo(-10 + i * 8, -20);
      ctx.lineTo(-5 + i * 8, 10);
      ctx.stroke();
    }
  }

  // Smoke if badly damaged
  if (damage > 60) {
    for (let s = 0; s < 3; s++) {
      ctx.fillStyle = `rgba(100,100,100,${0.3 - s * 0.08})`;
      ctx.beginPath();
      ctx.arc(20 - s * 5, -25 - s * 4, 4 + s * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawWheel(ctx, wx, wy, damage) {
  ctx.save();
  ctx.translate(wx, wy);
  if (damage > 50) {
    // flat tire wobble
    ctx.rotate((Math.random() - 0.5) * 0.3);
    ctx.scale(1, 0.6 + Math.random() * 0.3);
  }
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─────────────────────────────────────────────
// BUILD CAR SELECT
// ─────────────────────────────────────────────
const carGrid = document.getElementById('carGrid');
let selectedCarIdx = 0;

CARS.forEach((car, i) => {
  const card = document.createElement('div');
  card.className = 'car-card' + (i === 0 ? ' selected' : '');
  card.innerHTML = `
    <span class="badge-selected">✓ CHOSEN!</span>
    <canvas id="prev-${i}"></canvas>
    <div class="car-name">${car.name}</div>
    <div class="car-tag">${car.tag}</div>
    <div style="margin-top:6px;font-size:0.72rem;color:#aee87a;">${car.tags.join('  ')}</div>
  `;
  card.addEventListener('click', () => {
    document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedCarIdx = i;
  });
  carGrid.appendChild(card);

  // draw preview after append
  setTimeout(() => drawPreviewSUV(document.getElementById(`prev-${i}`), car), 10);
});

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-retry').addEventListener('click', startGame);
document.getElementById('btn-menu').addEventListener('click', () => {
  document.getElementById('screen-finish').style.display = 'none';
  document.getElementById('screen-select').style.display = 'flex';
});

// ─────────────────────────────────────────────
// GAME ENGINE
// ─────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Keys
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Touch
const touchState = { left: false, right: false, gas: false, brake: false };
function bindTouch(id, prop) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); touchState[prop] = true; }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); touchState[prop] = false; }, { passive: false });
  el.addEventListener('mousedown', () => touchState[prop] = true);
  el.addEventListener('mouseup', () => touchState[prop] = false);
}
bindTouch('tb-left', 'left');
bindTouch('tb-right', 'right');
bindTouch('tb-gas', 'gas');
bindTouch('tb-brake', 'brake');

function isLeft() { return keys['ArrowLeft'] || keys['a'] || keys['A'] || touchState.left; }
function isRight() { return keys['ArrowRight'] || keys['d'] || keys['D'] || touchState.right; }
function isGas() { return keys['ArrowUp'] || keys['w'] || keys['W'] || touchState.gas; }
function isBrake() { return keys['ArrowDown'] || keys['s'] || keys['S'] || touchState.brake; }

// ─────────────────────────────────────────────
// TRACK GENERATION
// ─────────────────────────────────────────────
const TRACK_WIDTH = 220;
const SEGMENT_LEN = 80;

function generateTrack(numSegments) {
  const points = [];
  let x = 0, y = 0, angle = 0;
  for (let i = 0; i < numSegments; i++) {
    points.push({ x, y, angle });
    const curve = (Math.random() - 0.5) * 0.5;
    angle += curve;
    x += Math.cos(angle) * SEGMENT_LEN;
    y += Math.sin(angle) * SEGMENT_LEN;
  }
  // close loop back near start
  return points;
}

// ─────────────────────────────────────────────
// BUMPS & PARTICLES
// ─────────────────────────────────────────────
let bumps = [];
let particles = [];

function spawnBumps(track) {
  bumps = [];
  for (let i = 5; i < track.length - 5; i += 3) {
    const seg = track[i];
    const offset = (Math.random() - 0.5) * TRACK_WIDTH * 0.6;
    const perp = seg.angle + Math.PI / 2;
    bumps.push({
      x: seg.x + Math.cos(perp) * offset,
      y: seg.y + Math.sin(perp) * offset,
      r: 10 + Math.random() * 14,
      type: Math.random() < 0.5 ? 'rock' : 'mud',
    });
  }
}

function addParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1,
      color,
      r: 3 + Math.random() * 4,
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.025;
  }
}

function drawParticles(camX, camY) {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX + W / 2, p.y - camY + H / 2, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
// AI CARS
// ─────────────────────────────────────────────
function createAI(carIdx, track, startOffset) {
  const seg = track[startOffset % track.length];
  return {
    car: CARS[carIdx],
    x: seg.x,
    y: seg.y,
    angle: seg.angle,
    speed: 0,
    segIdx: startOffset % track.length,
    t: 0,
    damage: 0,
    stuckTimer: 0,
    lap: 1,
    color: CARS[carIdx].color,
    name: CARS[carIdx].name,
  };
}

function updateAI(ai, track, dt) {
  if (ai.damage >= 100) return;

  const targetSeg = ai.segIdx + 2;
  const tSeg = track[targetSeg % track.length];
  const dx = tSeg.x - ai.x;
  const dy = tSeg.y - ai.y;
  const targetAngle = Math.atan2(dy, dx);
  let dAngle = targetAngle - ai.angle;
  while (dAngle > Math.PI) dAngle -= Math.PI * 2;
  while (dAngle < -Math.PI) dAngle += Math.PI * 2;

  const handling = ai.car.handling * (1 - ai.damage / 200);
  ai.angle += Math.sign(dAngle) * Math.min(Math.abs(dAngle), handling * 1.2);

  ai.speed = Math.min(ai.car.speed * (0.7 + Math.random() * 0.3) * (1 - ai.damage / 200), ai.car.speed);

  ai.x += Math.cos(ai.angle) * ai.speed;
  ai.y += Math.sin(ai.angle) * ai.speed;

  const dist = Math.hypot(tSeg.x - ai.x, tSeg.y - ai.y);
  if (dist < SEGMENT_LEN * 0.8) {
    ai.segIdx = (ai.segIdx + 1) % track.length;
    if (ai.segIdx === 0) ai.lap++;
  }
}

// ─────────────────────────────────────────────
// MAIN GAME STATE
// ─────────────────────────────────────────────
let gameState = null;
let animId = null;

function startGame() {
  document.getElementById('screen-select').style.display = 'none';
  document.getElementById('screen-finish').style.display = 'none';
  document.getElementById('screen-game').style.display = 'flex';

  // show touch on mobile
  if ('ontouchstart' in window) {
    document.getElementById('touch-controls').style.display = 'flex';
  }

  if (animId) cancelAnimationFrame(animId);

  const TOTAL_SEGS = 120;
  const LAPS = 3;
  const track = generateTrack(TOTAL_SEGS);
  spawnBumps(track);

  const pCar = CARS[selectedCarIdx];
  const startSeg = track[0];

  // AI opponents (different cars)
  const aiIndices = [0, 1, 2, 3].filter(i => i !== selectedCarIdx).slice(0, 3);
  const aiCars = aiIndices.map((carIdx, j) => createAI(carIdx, track, j * 4 + 2));

  gameState = {
    track,
    bumps,
    player: {
      car: pCar,
      x: startSeg.x + 30,
      y: startSeg.y,
      angle: startSeg.angle,
      speed: 0,
      damage: 0,
      segIdx: 0,
      lap: 1,
      finished: false,
      place: 1,
    },
    aiCars,
    particles: [],
    laps: LAPS,
    startTime: Date.now(),
    endTime: null,
    finishPlace: null,
    groundOffset: 0,
  };

  document.getElementById('hud-car').textContent = pCar.name;
  document.getElementById('hud-lap').textContent = '1';
  document.getElementById('hud-hp').textContent = '100';

  loop();
}

// ─────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────
function loop() {
  animId = requestAnimationFrame(loop);
  update();
  render();
}

function update() {
  if (!gameState) return;
  const { player, aiCars, track, laps } = gameState;
  if (player.finished) return;

  // ── PLAYER MOVEMENT ──
  const handling = player.car.handling * (1 - player.damage / 300);
  const maxSpeed = player.car.speed * (1 - player.damage / 150);

  if (isLeft()) player.angle -= handling;
  if (isRight()) player.angle += handling;

  if (isGas()) player.speed = Math.min(player.speed + 0.3, maxSpeed);
  else if (isBrake()) player.speed = Math.max(player.speed - 0.4, -maxSpeed * 0.4);
  else player.speed *= 0.95;

  player.x += Math.cos(player.angle) * player.speed;
  player.y += Math.sin(player.angle) * player.speed;

  // Check track segment progress
  const nextSeg = track[(player.segIdx + 1) % track.length];
  if (Math.hypot(nextSeg.x - player.x, nextSeg.y - player.y) < SEGMENT_LEN * 0.9) {
    player.segIdx = (player.segIdx + 1) % track.length;
    if (player.segIdx === 0 && player.lap < laps) player.lap++;
    else if (player.segIdx === 0 && player.lap >= laps) {
      player.finished = true;
      gameState.endTime = Date.now();
      // compute place
      let place = 1;
      for (const ai of aiCars) { if (ai.lap > player.lap || (ai.lap === player.lap && ai.segIdx > player.segIdx)) place++; }
      gameState.finishPlace = place;
      setTimeout(() => showFinish(), 500);
    }
  }

  // ── BUMP COLLISION ──
  for (const bump of gameState.bumps) {
    const d = Math.hypot(bump.x - player.x, bump.y - player.y);
    if (d < bump.r + 22 && player.speed > 0.5) {
      const dmg = (player.speed / player.car.speed) * (bump.type === 'rock' ? 12 : 6);
      player.damage = Math.min(100, player.damage + dmg);
      player.speed *= 0.5;
      const bumpColor = bump.type === 'rock' ? '#aaa' : '#8B5E3C';
      addParticles(player.x, player.y, bumpColor, 8);
      if (bump.type === 'rock') addParticles(player.x, player.y, '#FF6B35', 4);
    }
  }

  // ── AI UPDATE ──
  for (const ai of aiCars) {
    updateAI(ai, track, 0.016);

    // AI bump collision
    for (const bump of gameState.bumps) {
      const d = Math.hypot(bump.x - ai.x, bump.y - ai.y);
      if (d < bump.r + 22 && ai.speed > 0.5) {
        ai.damage = Math.min(100, ai.damage + (bump.type === 'rock' ? 8 : 4));
        ai.speed *= 0.6;
        addParticles(ai.x, ai.y, '#8B5E3C', 4);
      }
    }

    if (ai.segIdx === 0 && ai.lap >= laps && !ai.finished) {
      ai.finished = true;
    }
  }

  updateParticles();

  // ── HUD UPDATE ──
  document.getElementById('hud-lap').textContent = `${player.lap}`;
  document.getElementById('hud-hp').textContent = `${Math.max(0, Math.round(100 - player.damage))}`;
  const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
  document.getElementById('hud-time').textContent = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;
}

// ─────────────────────────────────────────────
// RENDERING
// ─────────────────────────────────────────────
function render() {
  if (!gameState) return;
  const { player, aiCars, track } = gameState;

  const camX = player.x;
  const camY = player.y;

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#5BA3D9');
  sky.addColorStop(1, '#A8D8EA');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Clouds (parallax)
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let c = 0; c < 6; c++) {
    const cx = ((c * 300 - camX * 0.1) % (W + 200) + W + 200) % (W + 200) - 100;
    const cy = 40 + c * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.arc(cx + 25, cy - 10, 22, 0, Math.PI * 2);
    ctx.arc(cx + 50, cy, 28, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mountains bg
  ctx.fillStyle = '#6B9E5E';
  for (let m = 0; m < 5; m++) {
    const mx = ((m * 280 - camX * 0.15) % (W + 300) + W + 300) % (W + 300) - 50;
    ctx.beginPath();
    ctx.moveTo(mx, H * 0.5);
    ctx.lineTo(mx + 120, H * 0.22);
    ctx.lineTo(mx + 240, H * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(mx + 120, H * 0.22);
    ctx.lineTo(mx + 90, H * 0.32);
    ctx.lineTo(mx + 150, H * 0.32);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#6B9E5E';
  }

  ctx.save();
  ctx.translate(W / 2 - camX, H / 2 - camY);

  // Ground
  ctx.fillStyle = '#7A9A50';
  ctx.fillRect(camX - W, camY - H, W * 3, H * 3);

  // Ground texture dots
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let gx = Math.floor((camX - W / 2) / 40) * 40; gx < camX + W; gx += 40) {
    for (let gy = Math.floor((camY - H / 2) / 40) * 40; gy < camY + H; gy += 40) {
      ctx.fillRect(gx + 5, gy + 5, 6, 6);
    }
  }

  // Draw track
  drawTrack(track, camX, camY);

  // Draw bumps
  for (const bump of gameState.bumps) {
    if (Math.abs(bump.x - camX) > W && Math.abs(bump.y - camY) > H) continue;
    if (bump.type === 'rock') {
      ctx.fillStyle = '#8A8A8A';
      ctx.beginPath();
      ctx.arc(bump.x, bump.y, bump.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.beginPath();
      ctx.arc(bump.x - 3, bump.y - 3, bump.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#5C3A1E';
      ctx.beginPath();
      ctx.ellipse(bump.x, bump.y, bump.r * 1.4, bump.r * 0.8, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw AI cars
  for (const ai of aiCars) {
    drawSUV(ctx, ai.x, ai.y, ai.car, ai.angle - Math.PI / 2, ai.damage, 1, true);
  }

  // Draw player car
  drawSUV(ctx, player.x, player.y, player.car, player.angle - Math.PI / 2, player.damage, 1, true);

  // Particles
  drawParticles(camX - W / 2 + camX, camY - H / 2 + camY);
  // (particles use absolute coords)
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  // Draw position indicators for off-screen cars
  drawMinimap(track, player, aiCars, camX, camY);
}

function drawTrack(track, camX, camY) {
  // Dirt base (wide)
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const seg = track[i];
    const nx = i === 0 ? ctx.moveTo(seg.x, seg.y) : ctx.lineTo(seg.x, seg.y);
  }
  ctx.lineTo(track[0].x, track[0].y);
  ctx.strokeStyle = '#C4894F';
  ctx.lineWidth = TRACK_WIDTH + 20;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Main dirt
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const seg = track[i];
    i === 0 ? ctx.moveTo(seg.x, seg.y) : ctx.lineTo(seg.x, seg.y);
  }
  ctx.lineTo(track[0].x, track[0].y);
  ctx.strokeStyle = '#D4A060';
  ctx.lineWidth = TRACK_WIDTH;
  ctx.stroke();

  // Track tire marks / texture lines
  ctx.strokeStyle = 'rgba(100,60,20,0.3)';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const seg = track[i];
    const perp = seg.angle + Math.PI / 2;
    const ox = Math.cos(perp) * 30;
    const oy = Math.sin(perp) * 30;
    i === 0 ? ctx.moveTo(seg.x + ox, seg.y + oy) : ctx.lineTo(seg.x + ox, seg.y + oy);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const seg = track[i];
    const perp = seg.angle + Math.PI / 2;
    const ox = Math.cos(perp) * (-30);
    const oy = Math.sin(perp) * (-30);
    i === 0 ? ctx.moveTo(seg.x + ox, seg.y + oy) : ctx.lineTo(seg.x + ox, seg.y + oy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Start/Finish line
  const s = track[0];
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle + Math.PI / 2);
  for (let tile = -5; tile < 5; tile++) {
    ctx.fillStyle = tile % 2 === 0 ? 'white' : 'black';
    ctx.fillRect(-12, tile * 12, 24, 12);
  }
  ctx.restore();
}

function drawMinimap(track, player, aiCars, camX, camY) {
  const mW = 130, mH = 80;
  const mX = W - mW - 14, mY = H - mH - 14;

  // find track bounds
  let mnX = Infinity, mnY = Infinity, mxX = -Infinity, mxY = -Infinity;
  for (const s of track) {
    if (s.x < mnX) mnX = s.x; if (s.y < mnY) mnY = s.y;
    if (s.x > mxX) mxX = s.x; if (s.y > mxY) mxY = s.y;
  }
  const scaleM = Math.min(mW / (mxX - mnX + 100), mH / (mxY - mnY + 100)) * 0.85;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(mX - 4, mY - 4, mW + 8, mH + 8, 10);
  ctx.fill();

  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const sx = mX + (track[i].x - mnX) * scaleM + 5;
    const sy = mY + (track[i].y - mnY) * scaleM + 5;
    i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
  }
  ctx.lineTo(mX + (track[0].x - mnX) * scaleM + 5, mY + (track[0].y - mnY) * scaleM + 5);
  ctx.strokeStyle = '#D4A060';
  ctx.lineWidth = 3;
  ctx.stroke();

  // AI dots
  for (const ai of aiCars) {
    ctx.fillStyle = ai.car.color;
    ctx.beginPath();
    ctx.arc(mX + (ai.x - mnX) * scaleM + 5, mY + (ai.y - mnY) * scaleM + 5, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player dot
  ctx.fillStyle = '#FFD93D';
  ctx.beginPath();
  ctx.arc(mX + (player.x - mnX) * scaleM + 5, mY + (player.y - mnY) * scaleM + 5, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function showFinish() {
  cancelAnimationFrame(animId);
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('touch-controls').style.display = 'none';

  const { player, aiCars, startTime, endTime, finishPlace, laps } = gameState;
  const elapsed = Math.floor((endTime - startTime) / 1000);
  const timeStr = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;

  const placeEmoji = ['🥇', '🥈', '🥉', '🏅'][finishPlace - 1] || '🏅';
  const placeName = ['1st', '2nd', '3rd', '4th'][finishPlace - 1] || `${finishPlace}th`;

  const title = document.getElementById('finish-title');
  const sub = document.getElementById('finish-subtitle');
  const stats = document.getElementById('finish-stats');

  if (finishPlace === 1) {
    title.textContent = '🏆 YOU WIN! 🏆';
    title.style.color = '#FFD93D';
    sub.textContent = 'Amazing driving! You crushed the off-road!';
  } else if (finishPlace === 2) {
    title.textContent = '🥈 SO CLOSE!';
    title.style.color = '#C0C0C0';
    sub.textContent = 'Great race! Just one more push next time!';
  } else {
    title.textContent = `${placeEmoji} ${placeName} PLACE`;
    title.style.color = '#CD7F32';
    sub.textContent = 'Good effort! Keep practicing!';
  }

  stats.innerHTML = `
    <div>🚙 Your Car: <strong>${player.car.name}</strong></div>
    <div>🏁 Laps Completed: <strong>${laps}</strong></div>
    <div>⏱️ Your Time: <strong>${timeStr}</strong></div>
    <div>💔 Car Damage: <strong>${Math.round(player.damage)}%</strong></div>
    <div>🏆 Finish Position: <strong>${placeName}</strong></div>
  `;

  document.getElementById('screen-finish').style.display = 'flex';
}

document.getElementById('btn-retry').addEventListener('click', startGame);
</script>
